services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vinted_qdrant
    ports:
      - "6333:6333" # Puerto para API HTTP / Dashboard
      - "6334:6334" # Puerto para gRPC (comunicación rápida desde Python/Spark)
    volumes:
      - ./qdrant_storage:/qdrant/storage # Para que los vectores no se borren al apagar
    restart: always